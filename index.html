<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kai-denrei</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background: #0a0a0f;
    color: #c8c8d0;
    min-height: 100vh;
    padding: 3rem 1.5rem;
  }

  header {
    max-width: 960px;
    margin: 0 auto 2.5rem;
    text-align: center;
  }

  header h1 {
    font-size: 1.6rem;
    font-weight: 400;
    color: #e0e0e8;
    letter-spacing: 0.08em;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.85rem;
    flex-wrap: wrap;
  }

  header p {
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: #666;
  }

  .search {
    margin-top: 1rem;
    width: 100%;
    max-width: 360px;
    padding: 0.55rem 0.85rem;
    background: #12121a;
    border: 1px solid #1e1e2a;
    border-radius: 4px;
    color: #c8c8d0;
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    outline: none;
    transition: border-color 0.15s;
  }

  .search::placeholder { color: #555; }
  .search:focus { border-color: #3a3a50; }

  .card.hidden { display: none; }

  .grid {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
  }

  .card {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: #12121a;
    border: 1px solid #1e1e2a;
    transition: border-color 0.2s, transform 0.2s;
  }

  .card:hover {
    border-color: #3a3a50;
    transform: translateY(-2px);
  }

  .card a {
    display: block;
    text-decoration: none;
    color: inherit;
  }

  .card .thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: #0e0e16;
  }

  .card .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: opacity 0.2s;
  }

  .card:hover .thumb img {
    opacity: 0.85;
  }

  .card .info {
    padding: 0.8rem 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .card h2 {
    font-size: 0.85rem;
    font-weight: 600;
    color: #e0e0e8;
    line-height: 1.3;
  }

  .card .desc {
    font-size: 0.72rem;
    color: #777;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card .tag {
    margin-top: 0.2rem;
    font-size: 0.62rem;
    color: #555;
    letter-spacing: 0.04em;
  }

  .deep-link {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    z-index: 2;
    font-size: 0.6rem;
    font-weight: 500;
    padding: 2px 7px;
    background: rgba(10, 10, 15, 0.7);
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 3px;
    color: #999;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    line-height: 1.4;
  }

  .deep-link:hover { color: #ddd; border-color: rgba(255,255,255,0.3); }
  .deep-link.copied { color: #8b9dc3; border-color: #8b9dc3; }

  /* Tablet: 2 columns */
  @media (max-width: 768px) {
    body { padding: 2rem 1rem; }
    header { margin: 0 auto 1.5rem; }
    .grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }
    .card .info { padding: 0.6rem 0.7rem; }
    .card h2 { font-size: 0.78rem; }
    .card .desc { font-size: 0.66rem; }
  }

  /* Phone: 1 column */
  @media (max-width: 440px) {
    body { padding: 1.5rem 0.75rem; }
    header h1 { font-size: 1.3rem; }
    .grid {
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }
    .card .info { padding: 0.7rem 0.8rem; }
    .card h2 { font-size: 0.82rem; }
    .card .desc { font-size: 0.68rem; -webkit-line-clamp: 3; }
  }

  /* ===== Completion braille bar ===== */
  .card-foot { padding: 0.1rem 0.9rem 0.85rem; }
  .completion { display: flex; align-items: center; gap: 0.5rem; }
  .braille-bar {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 1rem; line-height: 1; letter-spacing: 0.05em; user-select: none; white-space: nowrap;
  }
  .completion .pct { font-size: 0.62rem; color: #777; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  body.admin .braille-bar { cursor: ew-resize; padding: 3px 8px; font-size: 1.15rem; border-radius: 4px; }
  body.admin .braille-bar:hover { background: #16131c; }

  /* ===== Category chips / toggles ===== */
  .cats { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.55rem; }
  .cat-chip {
    font-size: 0.58rem; color: #8b9dc3; border: 1px solid #2a2f40; background: #161a26;
    border-radius: 3px; padding: 1px 6px; letter-spacing: 0.03em;
  }
  .cat-toggle {
    font-size: 0.58rem; color: #555; border: 1px solid #222; background: #12121a;
    border-radius: 3px; padding: 2px 6px; letter-spacing: 0.03em; cursor: pointer;
    transition: all 0.12s; font-family: inherit;
  }
  .cat-toggle:hover { border-color: #3a3a50; color: #aaa; }
  .cat-toggle.on { color: #0a0a0f; background: #c89a55; border-color: #c89a55; font-weight: 600; }

  /* ===== Filter bar ===== */
  .filters { max-width: 960px; margin: 0 auto 1.5rem; display: flex; flex-direction: column; gap: 0.55rem; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
  .filter-row .flabel {
    font-size: 0.58rem; color: #555; text-transform: uppercase; letter-spacing: 0.14em;
    margin-right: 0.3rem; min-width: 76px;
  }
  .fbtn {
    font-size: 0.65rem; color: #888; border: 1px solid #1e1e2a; background: #12121a; border-radius: 4px;
    padding: 0.3rem 0.6rem; cursor: pointer; letter-spacing: 0.03em; transition: all 0.12s; font-family: inherit;
  }
  .fbtn:hover { border-color: #3a3a50; color: #ccc; }
  .fbtn.active { color: #0a0a0f; background: #8b9dc3; border-color: #8b9dc3; font-weight: 600; }

  /* ===== Carousel ===== */
  .carousel { max-width: 960px; margin: 0 auto 2rem; position: relative; }
  .carousel-track {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 0;
    scrollbar-width: none; border-radius: 8px;
  }
  .carousel-track::-webkit-scrollbar { display: none; }
  .slide {
    scroll-snap-align: start; flex: 0 0 100%; position: relative; overflow: hidden;
    border: 1px solid #1e1e2a; background: #12121a;
  }
  .slide a { display: block; text-decoration: none; color: inherit; }
  .slide img { width: 100%; aspect-ratio: 16 / 7; object-fit: cover; display: block; }
  .slide-overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 1.2rem 1.4rem;
    background: linear-gradient(to top, rgba(8,8,14,0.94) 0%, rgba(8,8,14,0.55) 42%, transparent 78%);
  }
  .slide-overlay h2 { font-size: 1.15rem; color: #f0f0f5; font-weight: 600; letter-spacing: 0.01em; }
  .slide-overlay .desc {
    font-size: 0.72rem; color: #aaa; margin-top: 0.3rem; max-width: 72%; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .slide-meta { display: flex; align-items: center; gap: 0.8rem; margin-top: 0.7rem; }
  .slide-meta .braille-bar { font-size: 1.2rem; }
  .slide-feat {
    position: absolute; top: 0.8rem; left: 0.9rem; font-size: 0.55rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: #ffdca8; background: rgba(8,8,14,0.6); padding: 3px 8px;
    border-radius: 3px; backdrop-filter: blur(4px); z-index: 2;
  }
  .carousel-nav {
    position: absolute; top: calc(50% - 18px); transform: translateY(-50%); width: 36px; height: 36px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); background: rgba(10,10,15,0.65);
    color: #ccc; cursor: pointer; font-size: 1.1rem; line-height: 1; display: flex; align-items: center;
    justify-content: center; backdrop-filter: blur(4px); z-index: 3; transition: all 0.12s;
  }
  .carousel-nav:hover { border-color: rgba(255,255,255,0.4); color: #fff; }
  .carousel-nav.prev { left: 0.6rem; } .carousel-nav.next { right: 0.6rem; }
  .carousel-dots { display: flex; justify-content: center; gap: 0.4rem; margin-top: 0.7rem; }
  .cdot { width: 6px; height: 6px; border-radius: 50%; background: #2a2a3a; cursor: pointer; transition: all 0.12s; }
  .cdot.active { background: #c89a55; }
  .carousel-hint {
    max-width: 960px; margin: 0 auto 2rem; padding: 0.9rem 1.1rem; border: 1px dashed #1e1e2a;
    border-radius: 6px; color: #666; font-size: 0.72rem; text-align: center; letter-spacing: 0.03em;
  }
  .carousel-hint a { color: #8b9dc3; text-decoration: none; }
  .carousel-hint a:hover { text-decoration: underline; }

  /* ===== Admin chrome ===== */
  .export-btn {
    position: fixed; bottom: 1.2rem; left: 1.2rem; z-index: 50; font-family: inherit;
    font-size: 0.72rem; letter-spacing: 0.04em; color: #0a0a0f; background: #c89a55; border: none;
    border-radius: 6px; padding: 0.7rem 1.1rem; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    transition: all 0.12s; font-weight: 600;
  }
  .export-btn:hover { background: #ffdca8; }
  .export-btn .dirty-dot { display: none; }
  .export-btn.dirty .dirty-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #0a0a0f;
    margin-left: 0.45rem; vertical-align: middle;
  }
  .admin-badge {
    position: fixed; top: 0.8rem; left: 0.8rem; z-index: 50; font-size: 0.58rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: #ffdca8; border: 1px solid #3a2f1a; background: rgba(40,30,16,0.5);
    padding: 3px 9px; border-radius: 3px;
  }
  .save-status {
    position: fixed; bottom: 3.5rem; left: 1.25rem; z-index: 50; font-family: inherit;
    font-size: 0.62rem; letter-spacing: 0.04em; color: #777; transition: color 0.15s;
  }
  .grid-empty { grid-column: 1 / -1; color: #888; font-size: 0.8rem; text-align: center; padding: 2rem; }

  @media (max-width: 768px) {
    .slide-overlay .desc { max-width: 100%; }
    .slide-overlay h2 { font-size: 1rem; }
    .filter-row .flabel { min-width: auto; width: 100%; margin-bottom: 0.1rem; }
  }
</style>

<body>

<header>
  <div class="title-row">
    <h1>kai-denrei projects</h1>
    <span id="cb-badge-slot"></span>
  </div>
  <input type="search" class="search" id="search" placeholder="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
</header>

<div class="carousel" id="carousel" hidden>
  <button class="carousel-nav prev" id="cprev" aria-label="Previous">&#8249;</button>
  <div class="carousel-track" id="ctrack"></div>
  <button class="carousel-nav next" id="cnext" aria-label="Next">&#8250;</button>
  <div class="carousel-dots" id="cdots"></div>
</div>

<div class="carousel-hint" id="carousel-hint" hidden>
  Featured carousel fills with your highest-rated projects &mdash; assign completion in <a href="?admin">admin mode</a>.
</div>

<div class="filters" id="filters">
  <div class="filter-row" id="cat-row"><span class="flabel">category</span></div>
  <div class="filter-row" id="thr-row"><span class="flabel">completion</span></div>
</div>

<div class="grid" id="grid"></div>

<button class="export-btn" id="export-btn" hidden>Export JSON<span class="dirty-dot"></span></button>

<script>
(() => {
  "use strict";
  const cb = (document.querySelector('meta[name="cb"]') || {}).content || '';
  const ADMIN = new URLSearchParams(location.search).has('admin');
  const LS_KEY = 'kai-meta-overrides';

  // ---- Braille completion bar (4 glyphs, 37 states 0..36) ----
  const FILL_SHAPES = ['⠀','⡀','⡄','⡆','⡇','⣇','⣧','⣷','⣿'];
  const PLACEHOLDER = '⣿';
  const PALETTE = { dim:'#2a2620', 'default':'#8a6a3a', 'done-1':'#c89a55', 'done-2':'#dcb46d', 'done-3':'#efc88a', 'done-4':'#ffdca8' };
  const MAX_STATE = 36;

  function stateAt(n) {
    const glyphs = [PLACEHOLDER, PLACEHOLDER, PLACEHOLDER, PLACEHOLDER];
    const colors = ['dim', 'dim', 'dim', 'dim'];
    if (n <= 0) return { glyphs, colors };
    const bs = n - 1, block = Math.floor(bs / 9), inb = bs % 9;
    for (let i = 0; i < block; i++) colors[i] = 'done-' + (i + 1);
    if (inb < 8) { glyphs[block] = FILL_SHAPES[inb + 1]; colors[block] = 'default'; }
    else { colors[block] = 'done-' + (block + 1); }
    return { glyphs, colors };
  }
  // 3% per dot (24% per full glyph) + 1% color-lock at each quarter boundary -> exact 100%.
  function percentForState(n) {
    if (n <= 0) return 0;
    if (n >= MAX_STATE) return 100;
    const bs = n - 1, q = Math.floor(bs / 9), inb = bs % 9;
    return inb < 8 ? q * 25 + (inb + 1) * 3 : (q + 1) * 25;
  }
  function renderBar(n) {
    const s = stateAt(n);
    return s.glyphs.map((g, i) => '<span style="color:' + PALETTE[s.colors[i]] + '">' + g + '</span>').join('');
  }

  // ---- Data + localStorage overrides ----
  let CATEGORIES = [], projects = [];
  const byId = (id) => projects.find(p => p.id === id);
  const loadOv = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } };
  const saveOv = (o) => localStorage.setItem(LS_KEY, JSON.stringify(o));
  function persist(id) {
    const p = byId(id), ov = loadOv();
    ov[id] = { state: p.state, categories: p.categories };
    saveOv(ov);
    document.getElementById('export-btn').classList.add('dirty');
    scheduleSave();
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  // ---- Filter state ----
  let fCat = null, fThr = 0, fSearch = '';

  // ---- Card rendering ----
  function cardHTML(p) {
    const pct = percentForState(p.state);
    const catsPublic = p.categories.length
      ? '<div class="cats">' + p.categories.map(c => '<span class="cat-chip">' + esc(c) + '</span>').join('') + '</div>'
      : '';
    const catsAdmin = '<div class="cats">' + CATEGORIES.map(c =>
      '<button class="cat-toggle' + (p.categories.includes(c) ? ' on' : '') + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>'
    ).join('') + '</div>';
    return '' +
      '<div class="card" data-id="' + esc(p.id) + '">' +
        '<span class="deep-link" data-url="' + esc(p.url) + '">link</span>' +
        '<a href="' + esc(p.url) + '">' +
          '<div class="thumb"><img src="' + esc(p.img) + '?v=d1b55b99" alt="' + esc(p.alt) + '" loading="lazy"></div>' +
          '<div class="info">' +
            '<h2>' + esc(p.title) + '</h2>' +
            '<p class="desc">' + esc(p.desc) + '</p>' +
            '<span class="tag">' + esc(p.tag) + '</span>' +
          '</div>' +
        '</a>' +
        '<div class="card-foot">' +
          '<div class="completion"><span class="braille-bar" data-id="' + esc(p.id) + '">' + renderBar(p.state) + '</span><span class="pct">' + pct + '%</span></div>' +
          (ADMIN ? catsAdmin : catsPublic) +
        '</div>' +
      '</div>';
  }
  function renderGrid() {
    document.getElementById('grid').innerHTML = projects.map(cardHTML).join('');
  }
  function updateCard(id) {
    const p = byId(id);
    const card = document.querySelector('.card[data-id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
    if (!card) return;
    card.querySelector('.braille-bar').innerHTML = renderBar(p.state);
    card.querySelector('.completion .pct').textContent = percentForState(p.state) + '%';
  }

  // ---- Filters ----
  function buildFilters() {
    const catRow = document.getElementById('cat-row');
    const thrRow = document.getElementById('thr-row');
    const mk = (label, active, on) => {
      const b = document.createElement('button');
      b.className = 'fbtn' + (active ? ' active' : '');
      b.textContent = label; b.dataset.label = label; b.onclick = on; return b;
    };
    catRow.appendChild(mk('all', true, () => setCat(null)));
    CATEGORIES.forEach(c => catRow.appendChild(mk(c, false, () => setCat(c))));
    [['all', 0], ['≥25%', 25], ['≥50%', 50], ['≥75%', 75], ['100%', 100]].forEach(([lab, v], i) =>
      thrRow.appendChild(mk(lab, i === 0, () => setThr(v, lab))));
  }
  function setCat(c) { fCat = c; markActive('cat-row', c === null ? 'all' : c); applyFilters(); }
  function setThr(v, lab) { fThr = v; markActive('thr-row', lab); applyFilters(); }
  function markActive(rowId, label) {
    document.querySelectorAll('#' + rowId + ' .fbtn').forEach(b => b.classList.toggle('active', b.dataset.label === label));
  }
  function applyFilters() {
    document.querySelectorAll('#grid .card').forEach(card => {
      const p = byId(card.dataset.id), pct = percentForState(p.state);
      const okCat = !fCat || p.categories.includes(fCat);
      const okThr = pct >= fThr;
      const hay = (p.title + ' ' + p.desc + ' ' + p.tag + ' ' + p.categories.join(' ')).toLowerCase();
      const okSearch = !fSearch || hay.includes(fSearch);
      card.classList.toggle('hidden', !(okCat && okThr && okSearch));
    });
  }

  // ---- Carousel ----
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function buildCarousel() {
    const carousel = document.getElementById('carousel');
    const hint = document.getElementById('carousel-hint');
    const pool = projects.filter(p => p.state > 0).sort((a, b) => b.state - a.state).slice(0, 10);
    if (pool.length === 0) { carousel.hidden = true; hint.hidden = false; return; }
    hint.hidden = true; carousel.hidden = false;
    const feat = shuffle(pool).slice(0, 5);
    document.getElementById('ctrack').innerHTML = feat.map(p =>
      '<div class="slide">' +
        '<a href="' + esc(p.url) + '">' +
          '<span class="slide-feat">featured · ' + percentForState(p.state) + '%</span>' +
          '<img src="' + esc(p.img) + '?v=d1b55b99" alt="' + esc(p.alt) + '">' +
          '<div class="slide-overlay">' +
            '<h2>' + esc(p.title) + '</h2>' +
            '<p class="desc">' + esc(p.desc) + '</p>' +
            '<div class="slide-meta"><span class="braille-bar">' + renderBar(p.state) + '</span></div>' +
          '</div>' +
        '</a>' +
      '</div>'
    ).join('');
    setupCarouselNav(feat.length);
  }
  function setupCarouselNav(n) {
    const track = document.getElementById('ctrack');
    const dots = document.getElementById('cdots');
    dots.innerHTML = Array.from({ length: n }, (_, i) => '<span class="cdot' + (i === 0 ? ' active' : '') + '" data-i="' + i + '"></span>').join('');
    let idx = 0, timer = null;
    const setActive = (i) => dots.querySelectorAll('.cdot').forEach((d, di) => d.classList.toggle('active', di === i));
    function go(i) { idx = (i + n) % n; track.scrollTo({ left: idx * track.clientWidth, behavior: 'smooth' }); setActive(idx); }
    document.getElementById('cnext').onclick = () => { go(idx + 1); reset(); };
    document.getElementById('cprev').onclick = () => { go(idx - 1); reset(); };
    dots.querySelectorAll('.cdot').forEach(d => d.onclick = () => { go(+d.dataset.i); reset(); });
    let st;
    track.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(() => { const i = Math.round(track.scrollLeft / track.clientWidth); if (i !== idx) { idx = i; setActive(idx); } }, 90); });
    const start = () => { if (n > 1) timer = setInterval(() => go(idx + 1), 5000); };
    const reset = () => { clearInterval(timer); start(); };
    carousel: { const c = document.getElementById('carousel'); c.addEventListener('mouseenter', () => clearInterval(timer)); c.addEventListener('mouseleave', start); }
    start();
  }

  // ---- Interactions ----
  function wireGrid() {
    const grid = document.getElementById('grid');

    // Click: deep-link copy (always) + category toggle (admin).
    grid.addEventListener('click', (e) => {
      const dl = e.target.closest('.deep-link');
      if (dl) {
        e.preventDefault(); e.stopPropagation();
        navigator.clipboard.writeText(dl.dataset.url).then(() => {
          dl.textContent = 'copied!'; dl.classList.add('copied');
          setTimeout(() => { dl.textContent = 'link'; dl.classList.remove('copied'); }, 1500);
        });
        return;
      }
      if (!ADMIN) return;
      const tog = e.target.closest('.cat-toggle');
      if (tog) {
        const p = byId(tog.closest('.card').dataset.id), cat = tog.dataset.cat;
        const i = p.categories.indexOf(cat);
        if (i >= 0) p.categories.splice(i, 1); else p.categories.push(cat);
        tog.classList.toggle('on'); persist(p.id); applyFilters();
      }
    });

    if (!ADMIN) return;

    // Press-and-hold on the braille bar: one step on press, then auto-repeat at
    // an accelerating rate until release. Direction = which half was pressed.
    let holdTimer = null;
    const stopHold = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } };
    function step(id, dir) {
      const p = byId(id);
      const next = Math.max(0, Math.min(MAX_STATE, p.state + dir));
      if (next === p.state) return false;          // already at a bound
      p.state = next; persist(id); updateCard(id);
      return true;
    }
    function startHold(bar, clientX) {
      stopHold();
      const r = bar.getBoundingClientRect();
      const dir = (clientX - r.left) > r.width / 2 ? 1 : -1;
      const id = bar.dataset.id;
      step(id, dir);                               // immediate step on press
      let delay = 320;                             // initial pause before repeat
      const tick = () => {
        if (!step(id, dir)) { stopHold(); return; }
        delay = Math.max(45, delay * 0.78);        // accelerate each repeat
        holdTimer = setTimeout(tick, delay);
      };
      holdTimer = setTimeout(tick, delay);
    }

    grid.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      const bar = e.target.closest('.braille-bar');
      if (bar) { e.preventDefault(); startHold(bar, e.clientX); }
    });
    grid.addEventListener('touchstart', (e) => {
      const bar = e.target.closest('.braille-bar');
      if (bar) { e.preventDefault(); startHold(bar, e.touches[0].clientX); }
    }, { passive: false });
    ['mouseup', 'touchend', 'touchcancel', 'blur'].forEach(ev => window.addEventListener(ev, stopHold));
  }

  function buildPayload() {
    return {
      categories: CATEGORIES,
      projects: projects.map(p => ({
        id: p.id, title: p.title, url: p.url, img: p.img, alt: p.alt,
        desc: p.desc, tag: p.tag, categories: p.categories, state: p.state
      }))
    };
  }

  // ---- Auto-save: write data/projects.json to disk via the local dev server.
  // Falls back to localStorage + Export when no server is present (e.g. GH Pages).
  let saveTimer = null;
  function setSaveStatus(state, detail) {
    const el = document.getElementById('save-status');
    if (!el) return;
    const map = {
      saving:  ['saving…', '#dcb46d'],
      saved:   ['● saved' + (detail ? ' ' + detail : ''), '#73b05a'],
      dirty:   ['● unsaved', '#c89a55'],
      offline: ['● offline — use Export to save', '#c86a6a']
    };
    const [txt, col] = map[state] || ['', '#777'];
    el.textContent = txt; el.style.color = col;
  }
  function scheduleSave(delay) {
    setSaveStatus('dirty');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveToDisk, delay == null ? 600 : delay);
  }
  async function saveToDisk() {
    setSaveStatus('saving');
    try {
      const res = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(buildPayload())
      });
      if (!res.ok) throw new Error(res.status);
      setSaveStatus('saved', '· ' + new Date().toLocaleTimeString());
      document.getElementById('export-btn').classList.remove('dirty');
    } catch (e) {
      setSaveStatus('offline');
    }
  }

  function exportJSON() {
    const txt = JSON.stringify(buildPayload(), null, 2) + '\n';
    if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' }));
    a.download = 'projects.json';
    document.body.appendChild(a); a.click(); a.remove();
    document.getElementById('export-btn').classList.remove('dirty');
  }
  function setupAdmin() {
    if (!ADMIN) return;
    document.body.classList.add('admin');
    const badge = document.createElement('div');
    badge.className = 'admin-badge'; badge.textContent = 'admin mode';
    document.body.appendChild(badge);
    const status = document.createElement('div');
    status.id = 'save-status'; status.className = 'save-status';
    document.body.appendChild(status);
    const btn = document.getElementById('export-btn');
    btn.hidden = false; btn.onclick = exportJSON;
    // On load, flush current state (incl. any pre-existing local edits) to disk
    // and confirm server connectivity.
    saveToDisk();
  }

  // ---- Search ----
  const search = document.getElementById('search');
  search.addEventListener('input', () => { fSearch = search.value.trim().toLowerCase(); applyFilters(); });

  // ---- Init ----
  async function init() {
    let data;
    try {
      const res = await fetch('data/projects.json?v=' + cb);
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    } catch (e) {
      document.getElementById('grid').innerHTML =
        '<p class="grid-empty">Could not load data/projects.json &mdash; serve over http (e.g. localhost), not file://.</p>';
      return;
    }
    CATEGORIES = data.categories || [];
    const ov = loadOv();
    projects = data.projects.map(p => {
      const o = ov[p.id] || {};
      return Object.assign({}, p, {
        alt: p.alt || p.title,
        state: typeof o.state === 'number' ? o.state : (p.state || 0),
        categories: Array.isArray(o.categories) ? o.categories : (p.categories || [])
      });
    });
    renderGrid();
    buildFilters();
    wireGrid();
    buildCarousel();
    setupAdmin();
  }
  init();
})();
</script>

</body>
</html>
